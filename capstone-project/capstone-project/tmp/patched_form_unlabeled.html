<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<title>Form - Unlabeled Controls</title>
</head>
<body>
<h1>Contact</h1>
<form action="#">
<div>
<label>Label</label><input aria-label="Label" name="fullname" placeholder="Full name" type="text"/>
</div>
<div>
<label>Label</label><input aria-label="Label" name="email" placeholder="Email address" type="email"/>
</div>
<div>
<label>Label</label><input aria-label="Label" name="subscribe" type="checkbox"/> Subscribe to newsletter
    </div>
<button type="submit">Send</button>
</form>
</body>
</html>
