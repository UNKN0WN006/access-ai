<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Poor contrast example</title>
  <style>
    .low-contrast { color: #777777; background: #f0f0f0; }
    .ok { color: #000000; }
  </style>
</head>
<body>
  <h1 class="ok">Readability Test</h1>
  <p class="low-contrast">This paragraph uses a muted gray on a light background which can be hard to read.</p>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
  </nav>
  <img src="/images/logo.png" alt="Company logo">
</body>
</html>
