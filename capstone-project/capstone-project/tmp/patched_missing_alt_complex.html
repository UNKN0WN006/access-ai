<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8"/>
<title>Images without alt</title>
</head>
<body>
<h1>Gallery</h1>
<div class="gallery">
<img alt="Describe image" src="/images/photo1.jpg"/>
<figure>
<img alt="A beach at sunset" src="/images/photo2.jpg"/>
<figcaption>Sunset</figcaption>
</figure>
<img alt="Describe image" src="/images/photo3.jpg"/>
<img alt="Describe image" aria-hidden="true" src="/images/photo4.jpg"/>
</div>
<p>Some description about the gallery content.</p>
</body>
</html>
