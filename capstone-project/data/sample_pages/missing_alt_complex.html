<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Images without alt</title>
</head>
<body>
  <h1>Gallery</h1>
  <div class="gallery">
    <img src="/images/photo1.jpg">
    <figure>
      <img src="/images/photo2.jpg" alt="A beach at sunset">
      <figcaption>Sunset</figcaption>
    </figure>
    <img src="/images/photo3.jpg">
    <img src="/images/photo4.jpg" aria-hidden="true">
  </div>
  <p>Some description about the gallery content.</p>
</body>
</html>
